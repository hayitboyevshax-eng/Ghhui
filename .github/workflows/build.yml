name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Android papkasining qolgan qismini (gradle va h.k.) yaratadi.
      # Bizning fayllar (manifest, ikonka, MainActivity) ustidan yozilmaydi.
      - run: flutter create --org com.oldv2 --project-name pixcompact --platforms=android .
      # ffmpeg_kit uchun Android minSdk kamida 24 bo'lishi shart
      - name: minSdk 24
        run: |
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true
          grep -n "minSdk" android/app/build.gradle* || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PixCompact-apk
          path: build/app/outputs/flutter-apk/app-release.apk
