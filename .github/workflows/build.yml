name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Android papkasining qolgan qismini (gradle va h.k.) yaratadi.
      # Bizning fayllar (manifest, ikonka, MainActivity) ustidan yozilmaydi.
      - run: flutter create --org com.oldv2 --project-name pixcompact --platforms=android .
      # ffmpeg_kit uchun Android minSdk kamida 24 bo'lishi shart
      - name: minSdk 24
        run: |
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 24/' android/app/build.gradle 2>/dev/null || true
          grep -n "minSdk" android/app/build.gradle* || true
      # Eski plaginlar (masalan file_picker) android-33 ga qarab kompilyatsiya qilinadi,
      # yangi AndroidX esa 36 talab qiladi. Barcha plagin modullarni 36 ga ko'taramiz.
      - name: Plaginlar uchun compileSdk 36
        run: |
          if [ -f android/build.gradle.kts ]; then
            f=android/build.gradle.kts
            cat > /tmp/fix.gradle <<'EOF'
          subprojects {
              afterEvaluate {
                  // Barcha modullarda release lint vazifalarini o'chirish (lint qulashi uchun)
                  tasks.matching { it.name.startsWith("lintVital") || it.name.startsWith("lintAnalyze") }
                      .configureEach { enabled = false }
                  if (project.name != "app") {
                      extensions.findByName("android")?.withGroovyBuilder {
                          "compileSdkVersion"(36)
                      }
                  }
              }
          }

          EOF
          else
            f=android/build.gradle
            cat > /tmp/fix.gradle <<'EOF'
          subprojects {
              afterEvaluate { p ->
                  p.tasks.matching { it.name.startsWith('lintVital') || it.name.startsWith('lintAnalyze') }
                      .configureEach { it.enabled = false }
                  if (p.name != 'app' && p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }

          EOF
          fi
          cat /tmp/fix.gradle "$f" > /tmp/merged.gradle
          mv /tmp/merged.gradle "$f"
          head -20 "$f"
      # Release lint (lintVital) ba'zan plagin kodida qulaydi va APK yig'ilishini to'xtatadi.
      # APK uchun lint shart emas — o'chirib qo'yamiz.
      - name: Lint o'chirish
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          else
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
          fi
          grep -n -A4 "^android {" android/app/build.gradle*
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PixCompact-apk
          path: build/app/outputs/flutter-apk/app-release.apk
